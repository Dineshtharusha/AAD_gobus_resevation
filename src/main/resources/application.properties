# ===== Application =====
spring.application.name=gobus-api

# ===== DataSource =====
spring.datasource.url=jdbc:mysql://localhost:3306/gobus?autoReconnect=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=mysql

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.
jwt.expiration=86400000

# ===== Logging =====
logging.level.root=INFO
logging.level.Bus_Ticket_booking.ijse=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=logs/gobus-api.log
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== SpringDoc / Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false