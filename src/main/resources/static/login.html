<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | GoBus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="auth-container">
    <div class="auth-illustration">
        <div class="illustration-content">
            <h2>🚌 GoBus</h2>
            <p>Sri Lanka's smarter bus booking platform. Travel comfortably across the island.</p>
            <div class="features-list">
                <div class="feature"><i data-lucide="shield-check"></i> Secure payments</div>
                <div class="feature"><i data-lucide="ticket-check"></i> Instant e-tickets</div>
                <div class="feature"><i data-lucide="armchair"></i> Live seat availability</div>
                <div class="feature"><i data-lucide="bell"></i> Real-time notifications</div>
            </div>
        </div>
    </div>

    <div class="auth-box">
        <div class="auth-header">
            <a class="brand" href="index.html">
                <span class="brand-mark">G</span>
                <span>Go<span>Bus</span></span>
            </a>
            <h1 class="auth-subtitle">Welcome back</h1>
        </div>

        <form class="auth-form" id="login-form" novalidate>
            <div class="form-group">
                <label for="username">Username or Email</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input id="username" type="text" placeholder="Enter your username or email" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a class="forgot-password" href="#">Forgot password?</a>
            </div>

            <button class="btn-primary" type="submit">
                <i data-lucide="log-in"></i> Sign in
            </button>

            <div id="error-message"   class="error-message"   style="display:none;"></div>
            <div id="success-message" class="success-message" style="display:none;"></div>

            <div class="form-divider">or</div>

            <button class="btn-secondary" type="button" id="login-as-guest">
                <i data-lucide="user-round"></i> Continue as Guest
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="register.html">Create one free</a>
        </p>
        <p style="margin-top:12px;font-size:0.8rem;color:#94a3b8;text-align:center;">
            
        </p>
    </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
